[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veriagent"
version = "1.0.0-rc.1"
description = "Python SDK and offline verifier for VeriAgent audit evidence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "base58>=2.1.1",
    "cryptography>=44.0.0",
    "httpx>=0.28.0",
    "jcs>=0.2.1",
]

[project.scripts]
veriagent = "veriagent_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
]

[tool.setuptools]
py-modules = ["veriagent_cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["veriagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
